name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev
      - name: Install Buildozer
        run: |
          python -m pip install buildozer cython
      - name: Create buildozer.spec
        run: |
          buildozer init
      - name: Configure buildozer.spec
        run: |
          python3 - <<'EOF'
          import re
          with open("buildozer.spec") as f:
            content= f.read()
          content = re.sub(r'(?m)^title = .*','title = My school Timetable',content)
          content = re.sub(r'(?m)^package.name = .*','package.name = timetable',content)
          content = re.sub(r'(?m)^package.domain = .*','package.domain = org.example',content)
          content = re.sub(r'(?m)^requirments = .*','requirments = python3,kivy,charset-normalizer==3.3.2',content)
          content = re.sub(r'(?m)^orientation = .*','orientation = portrait',content)
          with open("buildozer.spec","w") as f:
            f.write(content)
          EOF
      - name:  Build APK
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timetable-apk
          path: bin/*.apk
